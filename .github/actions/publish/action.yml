name: Publish

description: Bump version, sync package.json, and publish

inputs:
  dry-run:
    description: 'Run in dry-run mode'
    required: true
    type: boolean

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: pnpm
    - run: pnpm install
      shell: bash

    # Check if version needs bumping by running elm bump
    - name: Try version bump
      id: version-bump
      run: |
        yes | pnpm exec elm bump || true
        # Check if version actually changed
        if git diff --quiet elm.json; then
          echo "bumped=false" >> $GITHUB_OUTPUT
        else
          echo "bumped=true" >> $GITHUB_OUTPUT
        fi
      shell: bash

    # Run formatter if version was bumped
    - name: Run formatter
      if: steps.version-bump.outputs.bumped == 'true'
      run: pnpm format
      shell: bash

    # Commit all changes if version was bumped
    - name: Commit version bump
      if: steps.version-bump.outputs.bumped == 'true'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore: elm bump"

    # Sync package.json version with elm.json
    - name: Sync package.json version
      run: |
        ELM_VERSION=$(jq -r '.version' elm.json)
        CURRENT_VERSION=$(jq -r '.version' package.json)
        if [ "$ELM_VERSION" != "$CURRENT_VERSION" ]; then
          pnpm version "$ELM_VERSION" --no-git-tag-version
        fi
      shell: bash

    # Re-run pnpm install to update lock file
    - run: pnpm install
      shell: bash

    # Run formatter again
    - run: pnpm format
      shell: bash

    # Commit all changes (package.json and lock file)
    - name: Commit package version sync
      if: steps.version-bump.outputs.bumped == 'true'
      uses: stefanzweifel/git-auto-commit-action@v7
      with:
        commit_message: "chore: sync package version"

    # Publish to Elm registry
    - name: Publish to Elm registry
      id: elm-publish
      uses: dillonkearns/elm-publish-action@v2
      with:
        github-token: ${{ github.token }}
        path-to-elm: ./node_modules/.bin/elm
        dry-run: ${{ inputs.dry-run }}

    # Create GitHub release only if not dry-run and publish succeeded
    - name: Create GitHub Release
      if: inputs.dry-run == false && success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(jq -r '.version' elm.json)
        gh release create "$VERSION" --generate-notes
      shell: bash
