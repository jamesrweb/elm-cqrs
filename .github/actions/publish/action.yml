name: Publish

description: Publish to Elm registry and create GitHub release

inputs:
  dry-run:
    description: Run in dry-run mode
    required: false
    type: boolean
    default: false
  github-token:
    description: GitHub token for publishing
    required: true
    type: string
  path-to-elm:
    description: Path to elm binary
    required: false
    type: string
    default: ./node_modules/.bin/elm

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v5

    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: pnpm

    - run: pnpm install
      shell: bash

    - name: Check if publishable
      id: publish-check
      uses: dillonkearns/elm-publish-action@v2
      with:
        dry-run: true
        path-to-elm: ${{ inputs.path-to-elm }}

    - name: Publish to Elm registry
      if: ${{ inputs.dry-run == 'false' && steps.publish-check.outputs.is-publishable == 'true' }}
      uses: dillonkearns/elm-publish-action@v2
      with:
        github-token: ${{ inputs.github-token }}
        path-to-elm: ${{ inputs.path-to-elm }}

    - name: Create GitHub Release
      if: ${{ inputs.dry-run == 'false' && steps.publish-check.outputs.is-publishable == 'true' }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        VERSION=$(jq -r '.version' elm.json)
        gh release create "$VERSION" --generate-notes
      shell: bash
