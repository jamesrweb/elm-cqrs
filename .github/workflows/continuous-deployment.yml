name: CD

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'elm.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/test

  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync package.json version
        id: version-sync
        run: |
          ELM_VERSION=$(jq -r '.version' elm.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          if [ "$ELM_VERSION" != "$PKG_VERSION" ]; then
            pnpm version "$ELM_VERSION" --no-git-tag-version
            echo "synced=true" >> $GITHUB_OUTPUT
          else
            echo "synced=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Commit version sync
        if: steps.version-sync.outputs.synced == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync package.json version with elm.json"
          file_pattern: package.json pnpm-lock.yaml
          branch: main

  publish:
    needs: [lint, test, sync-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}